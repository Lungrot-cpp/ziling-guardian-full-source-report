<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>位置灯板与模拟门 · Ti60</title>
<style>
:root{--serif:Georgia, "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;--sans:"Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;font:15px/1.6 var(--serif);color:#203833;background:#edf2ef}*{box-sizing:border-box}body{margin:0}header{background:#153e35;color:#fff;padding:22px max(20px,calc((100vw - 1200px)/2))}header h1{margin:0;font-size:25px}header a{color:#d9efe5}main{max-width:1240px;margin:auto;padding:22px;display:grid;grid-template-columns:1.1fr 1fr;gap:20px}section{background:white;border:1px solid #d9e2dc;border-radius:14px;padding:20px}h2{margin:0 0 12px;font-size:19px}p{margin:8px 0}.wide{grid-column:1/-1}canvas{display:block;width:100%;height:auto;background:#10231e;border-radius:8px}#camera{cursor:crosshair}button,input,select{font:inherit;font-family:var(--sans);border:1px solid #bdcfc5;border-radius:6px;padding:7px 10px}button{cursor:pointer;background:#edf5ef;color:#173c31;margin:4px 4px 4px 0}button.primary{background:#1f6652;color:#fff}button.stop{background:#a13a32;color:white}button:disabled{opacity:.45;cursor:default}input[type=number]{width:90px}label{display:inline-flex;align-items:center;gap:6px;margin:5px 12px 5px 0}.hint{font-size:13px;color:#5a6b63}.badge{display:inline-block;border-radius:20px;padding:3px 12px;background:#edf3ef;margin-right:8px}#notice{min-height:28px;color:#8a3b22}#connection{color:#e0eee7}#rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.room{flex:1;border-radius:8px;background:#e9efeb;padding:8px;text-align:center}.room.on{background:#ffe3a6;color:#674300}.room.alarm{background:#f6d7d2;color:#7a251e}#replayImage{width:min(480px,100%);image-rendering:pixelated;background:#132a23;border-radius:8px}table{border-collapse:collapse;width:100%}td,th{padding:6px;text-align:left;border-bottom:1px solid #edf0ee}td input{max-width:100%}details{margin-top:16px}summary{cursor:pointer;font-weight:600}#roomConfig input{width:76px}@media(max-width:850px){main{grid-template-columns:1fr;padding:12px}.wide{grid-column:auto}section{padding:15px}#roomConfig{font-size:12px}}
.embedded{background:transparent;color:#1b1610}.embedded header{display:none}.embedded main{max-width:none;padding:0;gap:16px}.embedded section{border-color:#eae5db;border-radius:12px}.embedded button,.embedded input,.embedded select{min-height:44px;border-color:#d8d1c7;border-radius:8px}.embedded button{background:#f3efe7;color:#1b1610}.embedded button.primary{background:#1b1610;color:white}.embedded button.stop{background:#9b3221;color:white}.embedded :focus-visible{outline:2px solid #82432b;outline-offset:3px}.embedded .hint{color:#5c554a}.embedded #roomConfig input{width:62px;padding-inline:3px}@media(max-width:600px){.embedded main{grid-template-columns:minmax(0,1fr)}.embedded section{min-width:0;padding:14px}.embedded #roomConfig{font-size:11px}.embedded #roomConfig td,.embedded #roomConfig th{padding:3px 1px}.embedded #roomConfig input{width:100%;min-width:0}.embedded #rooms{gap:4px}.embedded label{max-width:100%}.embedded input[type=file]{min-width:0;width:100%}}
table,.badge,#age,#door,#replayFrame{font-family:var(--sans)}
</style>
<script src="/privacy.js"></script>
<script>
const embedded=new URLSearchParams(location.search).get('embedded')==='1';let embeddedActive=true;
document.documentElement.classList.toggle('embedded',embedded);
function viewActive(){return !document.hidden&&(!embedded||embeddedActive)}
addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.type==='vf-page-visibility'){embeddedActive=!!e.data.active;if(!embeddedActive){playing=false;clearTimeout(playTimer)}else refreshCamera().catch(error=>notice(error.message))}});
</script>
<header><h1>位置灯板与模拟门</h1><div>Ti60 板内控制 · <a href="/">返回监测首页</a> <a href="/tracking.html">人员跟踪</a> <span id="connection">正在连接</span></div></header>
<main>
<section><h2>① 四点标定：远左 → 远右 → 近右 → 近左</h2><canvas id="camera" width="960" height="540"></canvas><img id="source" hidden alt="标定相机画面"><label><input id="livePreview" type="checkbox" aria-describedby="cameraStatus">实时预览（点击画面暂停选点）</label><p id="cameraStatus" class="hint" role="status">正在读取相机画面…</p><p id="pointInfo">尚未选择标定点</p><button id="refresh">刷新画面 / 重新选点</button><button class="primary" id="savePoints" disabled>应用四点标定</button></section>
<section><h2>② 16×16位置地图</h2><div><span id="position" class="badge">等待位置</span><span id="age" class="hint"></span></div><canvas id="map" width="512" height="512"></canvas><p id="lighting" class="hint" role="status">照明：等待位置</p><div id="rooms"><div class="room">厨房</div><div class="room">卫生间</div><div class="room">卧室</div><div class="room">客厅</div></div><button id="clearTrail">清除轨迹</button><details><summary>灯板和房间设置</summary><label>亮度 <input id="brightness" type="number" min="0" max="64" value="3"></label><label>每面墙灯珠 <input id="leds_per_room" type="number" min="1" max="8" value="7"></label><label>旋转 <select id="rotation"><option value="0">0°</option><option value="1">90°</option><option value="2">180°</option><option value="3">270°</option></select></label><label><input id="serpentine" type="checkbox" checked>蛇形走线</label><label>灯板色序 <select id="matrix_rgb"><option value="0">GRB</option><option value="1">RGB</option></select></label><label>灯带色序 <select id="strip_rgb"><option value="0">GRB</option><option value="1">RGB</option></select></label><table id="roomConfig"><tr><th>房间</th><th>左X</th><th>上Y</th><th>右X</th><th>下Y</th></tr></table><button id="saveLayout">应用房间设置</button></details></section>
<section><h2>③ 模拟门</h2><p id="door">读取状态中</p><label>停止μs（空载校准） <input id="neutral_us" type="number" min="1000" max="2000" value="1500"></label><label>开门μs <input id="open_us" type="number" min="1000" max="2000" value="1650"></label><label>关门μs <input id="close_us" type="number" min="1000" max="2000" value="1350"></label><label>转动毫秒 <input id="run_ms" type="number" min="20" max="2000" value="400"></label><div><button id="saveServo">保存舵机参数</button><button id="arm">使能（停止脉宽）</button><button id="disarm">停机并禁用</button></div><button class="primary" id="open">开门</button><button id="close">关门</button><button class="stop" id="stop">停止</button><p id="rescue">等待救援事件</p><button id="cancel">确认安全 / 取消救援</button><button class="stop" id="sos">SOS求救</button></section>
<section><h2>④ 事件短片</h2><p id="replayStatus">正在读取</p><img id="replayImage" alt="跌倒事件回放" hidden><p id="replayFrame" class="hint"></p><button id="play" disabled>播放</button><button id="pause">暂停</button><button id="newClip">清空并准备下一片段</button></section>
<section class="wide"><h2>设置与连接</h2><div id="notice" role="status"></div><button id="exportConfig">导出设置</button><label>导入设置 <input id="importConfig" type="file" accept="application/json,.json"></label></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),names=['厨房','卫生间','卧室','客厅'],camera=$('camera'),cx=camera.getContext('2d'),map=$('map'),mx=map.getContext('2d');
let points=[],frozen=false,status=null,initialized=false,connectedAt=0,playTimer=null,playing=false,clip=null,frameURL=null,cameraURL=null,cameraLoading=false,cameraImage=$('source'),cameraAttemptAt=0;
function clearLocalTrail(){if(status&&Array.isArray(status.trail_ages))status.trail_ages.fill(-1)}
for(let r=0;r<names.length;r++){let tr=document.createElement('tr');let name=document.createElement('td');name.textContent=names[r];tr.append(name);for(let j=0;j<4;j++){let td=document.createElement('td'),input=document.createElement('input');input.type='number';input.min=0;input.max=1;input.step=.01;input.id='r'+r+j;td.append(input);tr.append(td)}$('roomConfig').append(tr)}
const notice=t=>{$('notice').textContent=t};
async function get(path){let c=new AbortController(),t=setTimeout(()=>c.abort(),6000);try{let r=await fetch(path,{cache:'no-store',signal:c.signal});if(!r.ok)throw Error('请求失败 '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(data)});if(!r.ok)throw Error('设置未应用：检查参数；修改舵机参数前请先禁用');notice('操作已应用');return r.json()}
function action(cmd){return post('/api/care/action',{cmd})}
function wire(id,fn){$(id).onclick=()=>Promise.resolve().then(fn).catch(e=>notice(e.message))}
function drawCamera(){cx.clearRect(0,0,960,540);if(cameraImage.naturalWidth){if(globalThis.vfPrivacy)globalThis.vfPrivacy.draw(cx,cameraImage,0,0,960,540);else cx.drawImage(cameraImage,0,0,960,540)}cx.font='bold 25px sans-serif';points.forEach((p,i)=>{cx.fillStyle='#ffe58c';cx.beginPath();cx.arc(p[0]*960,p[1]*540,7,0,7);cx.fill();cx.fillText(String(i+1),p[0]*960+10,p[1]*540-8)});$('pointInfo').textContent='已选 '+points.length+'/4 点';$('savePoints').disabled=points.length!==4}
addEventListener('vf-privacy-change',drawCamera);
async function refreshCamera(){
 if(frozen||cameraLoading||!viewActive())return;
 cameraLoading=true;cameraAttemptAt=Date.now();$('refresh').disabled=true;if(!$('livePreview').checked||!cameraImage.naturalWidth)$('cameraStatus').textContent='正在读取新画面…';
 try {
  for(const [path,timeout] of [['http://192.168.0.3:8093/api/frame.jpg',2000],['/frame.bmp',6000]]) {
   let url;
   try {
    const r=await fetch(path+'?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(timeout)});
    if(!r.ok)throw Error('相机画面尚未就绪');
    url=URL.createObjectURL(await r.blob());
    const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('相机画面解码失败'));image.src=url});
    if(frozen||!viewActive()){URL.revokeObjectURL(url);return;}
    if(cameraURL)URL.revokeObjectURL(cameraURL);cameraURL=url;cameraImage=image;drawCamera();
    const text=$('livePreview').checked?'实时预览中，点击画面暂停并选点':'画面已更新'+(r.headers.get('X-Frame-Id')?' · 相机帧 '+r.headers.get('X-Frame-Id'):'');
    if($('cameraStatus').textContent!==text)$('cameraStatus').textContent=text;
    return;
   } catch(error) {if(url)URL.revokeObjectURL(url);if(frozen||!viewActive())return;}
  }
  throw Error('取图失败，请检查网口视频接收程序后重试');
 } catch(error) {$('cameraStatus').textContent=error.message;throw error;}
 finally {cameraLoading=false;$('refresh').disabled=false;}
}
camera.onclick=e=>{if(!cameraImage.naturalWidth)return;frozen=true;$('livePreview').checked=false;$('cameraStatus').textContent='画面已暂停，请按顺序选择四点';if(points.length>=4)return;let r=camera.getBoundingClientRect();points.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]);drawCamera()};
$('livePreview').onchange=()=>{frozen=!$('livePreview').checked;if(frozen)$('cameraStatus').textContent='画面已暂停，可继续选择标定点';else refreshCamera().catch(e=>notice(e.message))};
wire('refresh',async()=>{points=[];frozen=false;drawCamera();await refreshCamera()});
wire('savePoints',async()=>{let d={};points.flat().forEach((v,i)=>d['p'+i]=v.toFixed(7));await post('/api/care/config',d);clearLocalTrail()});
function inputConfig(s){let c=s.config;for(let key of ['brightness','leds_per_room','rotation','matrix_rgb','strip_rgb','neutral_us','open_us','close_us','run_ms'])$(key).value=c[key];$('serpentine').checked=!!c.serpentine;s.rooms.forEach((r,i)=>r.rect.forEach((v,j)=>$('r'+i+j).value=v))}
function trailColor(age,step=3000){if(age<0||age>=3*step)return null;return age<step?'#62c78c':age<2*step?'#519bd5':'#e67364'}
function drawMap(){mx.fillStyle='#10231e';mx.fillRect(0,0,512,512);mx.strokeStyle='#29433a';for(let n=0;n<=16;n++){mx.beginPath();mx.moveTo(n*32,0);mx.lineTo(n*32,512);mx.moveTo(0,n*32);mx.lineTo(512,n*32);mx.stroke()};if(!status)return;status.rooms.forEach((r,i)=>{let[a,b,c,d]=r.rect;mx.strokeStyle=['#8fb6a1','#b4cfa2','#9aaed2','#cca99a'][i];mx.lineWidth=2;mx.strokeRect(a*512,b*512,(c-a)*512,(d-b)*512);mx.fillStyle='#b8c9bf';mx.font='17px sans-serif';mx.fillText(names[i],a*512+8,b*512+24)});let elapsed=Math.max(0,Date.now()-connectedAt);if(Array.isArray(status.trail_ages))status.trail_ages.forEach((age,cell)=>{if(age<0)return;let color=trailColor(age+elapsed,status.trail_step_ms||3000);if(color){mx.fillStyle=color;mx.fillRect(cell%16*32+10,Math.floor(cell/16)*32+10,12,12)}});if(status.valid&&connectedAt&&status.age_ms+elapsed<=2200){let x=Math.min(15,Math.floor(status.x*16)),y=Math.min(15,Math.floor(status.y*16));mx.fillStyle=['#69e7a2','#ffce65','#ff7466'][status.risk]||'#69e7a2';mx.beginPath();mx.arc(x*32+16,y*32+16,12,0,7);mx.fill()}}
async function update(){if(!viewActive()){setTimeout(update,800);return}try{let s=await get('/api/care');status=s;connectedAt=Date.now();$('connection').textContent=s.hardware?'外设接口已连接':'当前bit缺少CAR1外设接口';if(!initialized){inputConfig(s);initialized=true}$('position').textContent=!s.calibrated?'请先完成四点标定':s.valid?(s.room>=0?names[s.room]:'分区外'):'位置失效 / 等待检测';$('age').textContent=s.valid?'采样距今 '+s.age_ms+' ms':'';$('lighting').textContent=!s.hardware?'照明：外设接口未连接':s.alarm?'照明：四面墙红色闪烁':s.valid&&s.wall>=0?'照明：'+['上墙','右墙','下墙','左墙'][s.wall]:'照明：等待有效位置';document.querySelectorAll('.room').forEach((e,i)=>{e.classList.toggle('on',s.rooms[i].lit);e.classList.toggle('alarm',s.alarm&&s.rooms[i].lit)});$('door').textContent=(s.armed?'已使能':'未使能')+' · '+(['禁用','停止','开门转动中','关门转动中','已发送停止','正在停机'] [s.door_state]||'未知')+(s.remaining_ms?' · 剩余 '+s.remaining_ms+' ms':'');$('open').disabled=$('close').disabled=!s.armed;$('rescue').textContent=s.alarm?'救援已触发：开门联动 / 全部照明灯红闪':'等待救援事件';drawMap()}catch(e){connectedAt=0;$('connection').textContent='连接中断';$('position').textContent='连接中断，位置不可用';$('lighting').textContent='照明：连接中断，状态未知';document.querySelectorAll('.room').forEach(e=>e.classList.remove('on','alarm'));$('open').disabled=$('close').disabled=true;drawMap()}setTimeout(update,800)}
for(let cmd of ['arm','disarm','open','close','stop','cancel','sos'])wire(cmd,()=>action(cmd));
wire('clearTrail',async()=>{await action('clear_trail');clearLocalTrail();drawMap()});
wire('saveServo',()=>{let d={};for(let k of ['neutral_us','open_us','close_us','run_ms'])d[k]=$(k).value;return post('/api/care/config',d)});
wire('saveLayout',async()=>{let d={};for(let k of ['brightness','leds_per_room','rotation','matrix_rgb','strip_rgb'])d[k]=$(k).value;d.serpentine=$('serpentine').checked?1:0;for(let i=0;i<names.length;i++)for(let j=0;j<4;j++)d['r'+i+j]=$('r'+i+j).value;await post('/api/care/config',d);clearLocalTrail()});
wire('exportConfig',()=>{if(!status)throw Error('等待板端设置');let blob=new Blob([JSON.stringify({config:status.config,rooms:status.rooms,calibrated:status.calibrated},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='care-settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
$('importConfig').onchange=async e=>{try{let file=e.target.files[0];if(!file)return;let s=JSON.parse(await file.text()),d={};if(!Array.isArray(s.rooms)||s.rooms.length!==names.length)throw Error('设置文件需要包含四个房间');for(let k of ['brightness','leds_per_room','rotation','matrix_rgb','strip_rgb','serpentine','neutral_us','open_us','close_us','run_ms'])d[k]=s.config[k];s.rooms.forEach((r,i)=>r.rect.forEach((v,j)=>d['r'+i+j]=v));if(s.calibrated)s.config.corners.forEach((v,i)=>d['p'+i]=v);await post('/api/care/config',d);initialized=false;clearLocalTrail()}catch(e){notice(e.message)}};
async function updateReplay(schedule=true){if(!viewActive()){if(schedule)setTimeout(updateReplay,2500);return}try{let r=await get('/api/replay');clip=r;$('replayStatus').textContent=r.ready?'片段已保存，共 '+r.count+' 帧':r.recording_post?'正在记录跌倒后画面':'等待新跌倒，已缓存 '+r.buffered+' 帧';$('play').disabled=!r.ready||!r.count}catch(e){$('replayStatus').textContent='回放连接中断'}if(schedule)setTimeout(updateReplay,2500)}
async function showFrame(i,c){if(!playing)return;try{let r=await fetch('/replay.bmp?clip='+c.clip+'&index='+i,{cache:'no-store'});if(!r.ok)throw Error('片段已不可用');let url=URL.createObjectURL(await r.blob());if(!playing){URL.revokeObjectURL(url);return}if(frameURL)URL.revokeObjectURL(frameURL);frameURL=url;$('replayImage').hidden=false;$('replayImage').src=url;$('replayFrame').textContent='第 '+(i+1)+'/'+c.count+' 帧 · 相机帧号 '+c.frames[i].frame;if(i+1<c.count){let dt=((c.frames[i+1].capture_us-c.frames[i].capture_us)>>>0)/1000;playTimer=setTimeout(()=>showFrame(i+1,c),Math.min(10000,Math.max(50,dt)))}else playing=false}catch(e){notice(e.message);playing=false}}
wire('play',()=>{clearTimeout(playTimer);if(clip&&clip.ready){playing=true;return showFrame(0,clip)}});wire('pause',()=>{playing=false;clearTimeout(playTimer)});wire('newClip',async()=>{playing=false;clearTimeout(playTimer);await post('/api/replay/reset',{});$('replayImage').hidden=true;$('replayFrame').textContent='';await updateReplay(false)});
function animateMap(){if(viewActive()){drawMap();if($('livePreview').checked&&!frozen&&!cameraLoading&&Date.now()-cameraAttemptAt>=200)refreshCamera().catch(()=>{})}setTimeout(animateMap,100)}
animateMap();update();updateReplay();refreshCamera().catch(e=>notice(e.message));
</script></html>
